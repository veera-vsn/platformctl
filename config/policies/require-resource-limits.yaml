apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platformctl-require-resource-limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-cpu-and-memory-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["app-*"]
      validate:
        message: "Every container must define CPU and memory requests and limits."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
