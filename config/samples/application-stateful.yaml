apiVersion: platform.veera.dev/v1alpha1
kind: Application
metadata:
  name: cache
  namespace: platform-system
spec:
  type: stateful
  image: redis:7.4-alpine
  version: "7.4"
  port: 6379
  replicas: 1
  storage: 1Gi
  mountPath: /data
  fsGroup: 999
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
