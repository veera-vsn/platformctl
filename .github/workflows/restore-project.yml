name: Restore platformctl source
on:
  push:
    paths:
      - "project_payload.b64"
permissions:
  contents: write
jobs:
  restore:
    if: ${{ github.event.head_commit.message == 'Bootstrap platformctl source' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore source files
        run: |
          python - <<'PY'
          import base64
          import json
          import lzma
          from pathlib import Path

          payload = Path("project_payload.b64")
          data = json.loads(lzma.decompress(base64.b64decode(payload.read_text())))
          for name, content in data.items():
              path = Path(name)
              if path.is_absolute() or ".." in path.parts:
                  raise ValueError(f"Unsafe archive path: {name}")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          payload.unlink()
          print(f"Restored {len(data)} project files")
          PY
      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add complete platformctl source tree"
            git push
          fi
